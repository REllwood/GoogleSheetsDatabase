[build-system]
requires = ["setuptools>=77"]
build-backend = "setuptools.build_meta"

[project]
name = "googlesheetsdb"
version = "0.1.0"
description = "Use a Google Sheet as a small database table with SQL-like queries."
readme = "readme.md"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Rhys Ellwood" }]
requires-python = ">=3.10"
dependencies = [
    "gspread>=6.1,<7",
    "google-auth>=2.15",
]

[project.optional-dependencies]
dev = ["pytest>=8"]

[project.urls]
Homepage = "https://github.com/REllwood/GoogleSheetsDatabase"

[tool.setuptools]
packages = ["googlesheetsdb"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["tests"]
